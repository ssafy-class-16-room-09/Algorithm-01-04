name: Generate problem files

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "파일을 생성할 브랜치 (all = 전체)"
        type: choice
        default: all
        options:
          - all
          - main
          - scm
          - hig
          - hjh
          - hjy

permissions:
  contents: write

# 여러 번 눌러도 동시에 실행되지 않도록 순차 처리 (중복 커밋 방지)
concurrency:
  group: generate-problem-files
  cancel-in-progress: false

env:
  # ── 브랜치별 설정 ──────────────────────────────────────────────
  # 풀이 언어: 여기 나열된 브랜치는 파이썬(.py), 나머지는 자바(.java)
  PYTHON_BRANCHES: "hjh"
  # 채점 실행 파일: 여기 나열된 브랜치는 자바(<문제명>Test/Submit.java, IntelliJ용),
  #                나머지는 파이썬(test.py/submit.py, VSCode용)
  JAVA_RUNNER_BRANCHES: "hig"
  # main 브랜치는 항상 자바+파이썬 풀이, 실행 파일도 둘 다 생성 (누구나 실행 가능)
  # 표의 "언어" 칸이 java 인 문제(B형 등)는 위 설정과 무관하게 자바만 생성된다.
  # ─────────────────────────────────────────────────────────────

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate files on each branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # PROBLEMS.md와 스크립트는 항상 main 기준으로 사용 (브랜치 전환과 무관하게)
          git show origin/main:PROBLEMS.md > "$RUNNER_TEMP/PROBLEMS.md"
          git show origin/main:.github/scripts/generate_problem_files.py > "$RUNNER_TEMP/generate_problem_files.py"

          if [ "${{ inputs.branch }}" = "all" ]; then
            branches="main scm hig hjh hjy"
          else
            branches="${{ inputs.branch }}"
          fi

          for br in $branches; do
            if ! git rev-parse --verify "origin/$br" > /dev/null 2>&1; then
              echo "::warning::브랜치 origin/$br 이(가) 없어 건너뜀"
              continue
            fi
            if [ "$br" = "main" ]; then
              lang=both; runner=both
            else
              case " $PYTHON_BRANCHES " in
                *" $br "*) lang=python ;;
                *) lang=java ;;
              esac
              case " $JAVA_RUNNER_BRANCHES " in
                *" $br "*) runner=java ;;
                *) runner=py ;;
              esac
            fi
            echo "=== $br (lang=$lang, runner=$runner) ==="
            git switch -C "$br" "origin/$br"
            python3 "$RUNNER_TEMP/generate_problem_files.py" "$RUNNER_TEMP/PROBLEMS.md" --lang "$lang" --runner "$runner"
            # 채점기(tools/)와 테스트케이스(testcases/)를 main 기준으로 동기화
            if [ "$br" != "main" ]; then
              for path in tools testcases; do
                if git cat-file -e "origin/main:$path" 2>/dev/null; then
                  git checkout origin/main -- "$path"
                fi
              done
            fi
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "chore: 문제 파일 생성 및 테스트케이스 동기화"
              git push origin "$br"
            else
              echo "$br: 변경 없음"
            fi
          done
